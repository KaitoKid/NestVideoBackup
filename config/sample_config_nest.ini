[nest]
# Your local timezone, used for filenaming on your local storage
# See: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
timezone = America/Los_Angeles

# How often to fetch your video data, in minutes
refresh_interval = 60

# How many minutes of video history to fetch each sync (default: 240 = 4 hours)
# Recommended: 240 for free Nest Aware (3 hr history + 1 hr buffer)
fetch_range = 240

# Your Google account email to which the cameras are bound
google_username = youremail@gmail.com

# The master token - see README for instructions on how to obtain this
google_master_token = YOUR_MASTER_TOKEN_HERE

# whether to clean up space starting with old videos based on max_age_days and max_size_mb
cleanup_enabled: false

# Max age on the disk before removing oldest videos default:60days
max_age_days: 60

# Max size on the disk before removing oldest videos default:100GB
max_size_mb: 100000
